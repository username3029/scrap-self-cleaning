<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      width: 280px;
      padding: 16px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #e74c3c;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      font-weight: bold;
    }
    h1 { font-size: 18px; font-weight: 600; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ecc71;
    }
    .info {
      font-size: 12px;
      color: #a0a0b0;
      line-height: 1.5;
    }
    .info strong { color: #e0e0e0; }
    hr { border: none; border-top: 1px solid #2a2a4e; margin: 12px 0; }
    .note {
      font-size: 11px;
      color: #707080;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">♻</div>
    <h1>Scrap</h1>
  </div>
  <div class="status">
    <span class="dot"></span>
    <span>Extension active</span>
  </div>
  <div class="info">
    <strong>Right-click</strong> any download link, video, or audio, then select<br />
    <strong>"Download to Scrap"</strong>
    to route the file directly into your Scrap folder.
  </div>
  <hr />
  <div class="note">
    Scrap deletes files after 24 hours.<br />
    Move important files out to keep them safe.
  </div>
</body>
</html>
